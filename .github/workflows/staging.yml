# Runs on every push to staging (which autodeploys the staging app) and on PRs into staging
name: Staging

on:
  push:
    branches:
      - staging
  pull_request:
    branches:
      - staging
    types: [opened, synchronize, reopened]

# Cancel older runs on the same branch/PR when new commits are pushed
concurrency:
  group: staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    uses: ./.github/workflows/ci.yml
